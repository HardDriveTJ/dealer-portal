<script>
window.addEventListener("load", function () {

  const canvas = document.getElementById("salesChart");

  if (!canvas) {
    document.body.innerHTML = "<h2 style='color:white'>Missing chart element</h2>";
    return;
  }

  const ctx = canvas.getContext("2d");

  if (typeof Chart === "undefined") {
    document.body.innerHTML = "<h2 style='color:white'>Chart.js failed to load</h2>";
    return;
  }

  new Chart(ctx, {
    type: "line",
    data: {
      labels: ["Jan","Feb","Mar","Apr","May","Jun"],
      datasets: [{
        label: "Sales",
        data: [12000,15000,13000,17000,16000,18220],
        borderColor: "#38bdf8",
        tension: 0.3
      }]
    }
  });

});
</script>
